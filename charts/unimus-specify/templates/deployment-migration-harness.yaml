{{- if .Values.migrationHarness.enabled }}
{{- $s7 := .Values.specify7 | default dict }}
{{- $mariadb := $s7.mariadb | default dict }}
{{- $mariadbAuth := $mariadb.auth | default dict }}
{{- $specify := $s7.specify | default dict }}
{{- $db := $specify.database | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unimus-specify.specify7Fullname" . }}-migration-harness
  labels:
    {{- include "unimus-specify.labels" . | nindent 4 }}
    component: migration-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "unimus-specify.selectorLabels" . | nindent 6 }}
      component: migration-harness
  template:
    metadata:
      labels:
        {{- include "unimus-specify.selectorLabels" . | nindent 8 }}
        component: migration-harness
    spec:
      {{- with $s7.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration-harness
          image: "{{ .Values.migrationHarness.image.repository }}:{{ .Values.migrationHarness.image.tag }}"
          imagePullPolicy: {{ .Values.migrationHarness.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.migrationHarness.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: DB_HOST
              value: {{ if $mariadb.enabled }}{{ .Release.Name }}-mariadb{{ else }}{{ $db.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ $db.port | default 3306 | quote }}
            - name: DB_NAME
              value: {{ $mariadbAuth.database | quote }}
            - name: DB_USER
              value: {{ $mariadbAuth.username | quote }}
            - name: HARNESS_PORT
              value: {{ .Values.migrationHarness.service.port | quote }}
            - name: HARNESS_BASE_PATH
              value: {{ .Values.migrationHarness.basePath | quote }}
            - name: HARNESS_DEFAULT_COLLECTION
              value: {{ .Values.migrationHarness.defaultCollection | quote }}
            - name: HARNESS_DEFAULT_ORACLE_ENV
              value: {{ .Values.migrationHarness.defaultOracleEnv | quote }}
          {{- $secret := include "unimus-specify.existingSecret" . }}
          {{- if $secret }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrationHarness.resources | nindent 12 }}
{{- end }}
