{{- if and .Values.prefect.enabled .Values.prefect.devWorker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unimus-specify.specify7Fullname" . }}-prefect-dev-worker
  labels:
    {{- include "unimus-specify.labels" . | nindent 4 }}
    component: prefect-dev-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "unimus-specify.selectorLabels" . | nindent 6 }}
      component: prefect-dev-worker
  template:
    metadata:
      labels:
        {{- include "unimus-specify.selectorLabels" . | nindent 8 }}
        component: prefect-dev-worker
    spec:
      {{- with .Values.specify7.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dev-worker
          image: "{{ .Values.prefect.devWorker.image.repository }}:{{ .Values.prefect.devWorker.image.tag }}"
          imagePullPolicy: {{ .Values.prefect.devWorker.image.pullPolicy }}
          workingDir: /app
          command: ["prefect", "worker", "start"]
          args:
            - --pool
            - {{ .Values.prefect.devWorker.workPool }}
            - --type
            - process
          env:
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            {{- if .Values.prefect.server.enabled }}
            - name: PREFECT_API_URL
              value: "http://{{ include "unimus-specify.specify7Fullname" . }}-prefect-server:4200/api"
            {{- end }}
            {{- if not (eq (.Values.specify7.assetServer).enabled false) }}
            - name: ASSET_SERVER_INTERNAL_BASE
              value: "http://{{ include "unimus-specify.specify7Fullname" . }}-asset-server"
            {{- end }}
            {{- if .Values.prefect.devWorker.sshKeySecret }}
            - name: TEST_DB_SSH_PRIVATE_KEY_PATH
              value: "{{ .Values.prefect.devWorker.sshKeyMountPath }}/{{ .Values.prefect.devWorker.sshKeySecretKey }}"
            {{- end }}
          {{- $secret := include "unimus-specify.existingSecret" . }}
          {{- if $secret }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          {{- end }}
          {{- if .Values.prefect.devWorker.sshKeySecret }}
          volumeMounts:
            - name: test-db-ssh-key
              mountPath: {{ .Values.prefect.devWorker.sshKeyMountPath | quote }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.prefect.devWorker.resources | nindent 12 }}
      {{- if .Values.prefect.devWorker.sshKeySecret }}
      volumes:
        - name: test-db-ssh-key
          secret:
            secretName: {{ .Values.prefect.devWorker.sshKeySecret | quote }}
            defaultMode: 0400
      {{- end }}
{{- end }}
