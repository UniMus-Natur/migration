{{- if and .Values.prefect.enabled .Values.prefect.server.enabled -}}
{{- $persist := .Values.prefect.server.persistence | default dict -}}
{{- $persistEnabled := and $persist.enabled $persist.existingClaim -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unimus-specify.specify7Fullname" . }}-prefect-server
  labels:
    {{- include "unimus-specify.labels" . | nindent 4 }}
    component: prefect-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "unimus-specify.selectorLabels" . | nindent 6 }}
      component: prefect-server
  template:
    metadata:
      labels:
        {{- include "unimus-specify.selectorLabels" . | nindent 8 }}
        component: prefect-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.prefect.image.repository }}:{{ .Values.prefect.image.tag }}"
          imagePullPolicy: {{ .Values.prefect.image.pullPolicy }}
          command: ["prefect", "server", "start"]
          args:
            - --host
            - 0.0.0.0
            - --port
            - "4200"
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          env:
            # Keep SQLite / server state on the mounted volume (survives reschedules).
            - name: PREFECT_HOME
              value: {{ $persist.mountPath | default "/root/.prefect" | quote }}
          {{- $secret := include "unimus-specify.existingSecret" . }}
          {{- if $secret }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          {{- end }}
          {{- if $persistEnabled }}
          volumeMounts:
            - name: prefect-home
              mountPath: {{ $persist.mountPath | default "/root/.prefect" | quote }}
              {{- if $persist.subPath }}
              subPath: {{ $persist.subPath | quote }}
              {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.prefect.server.resources | nindent 12 }}
      {{- if $persistEnabled }}
      volumes:
        - name: prefect-home
          persistentVolumeClaim:
            claimName: {{ $persist.existingClaim | quote }}
      {{- end }}
{{- end }}
