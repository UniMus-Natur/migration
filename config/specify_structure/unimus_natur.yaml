# Desired Specify 7 hierarchy (post-bootstrap: institution already exists).
# Sync with: flows/sync_specify_structure.py
#
# institution_name: must match an existing Institution row.
# divisions / disciplines / collections: additive only (create-if-missing);
# discipline.type is reconciled (updated if wrong).
#
# discipline.type MUST be a Specify DisciplineType picklist value — these are
# the keys in specifyweb.backend.context.app_resource.DISCIPLINE_DIRS and select
# which config/<folder>/ disk defaults (forms, express search, …) apply:
#
#   fish | herpetology | paleobotany | invertpaleo | vertpaleo
#   bird | mammal | insect | botany | invertebrate | geology

institution_name: "UniMus:Natur"

divisions:
  - name: Biology
    disciplines:
      - name: Karplanter Moser
        type: botany
        collections:
          - { code: O-V, name: NHM-karplanter }
      - name: Alger
        type: botany
      - name: Lav Sopp
        type: botany
      - name: Insekter
        type: insect
      - name: Marine invertebrater
        type: invertebrate
      - name: Pattedyr
        type: mammal
      - name: Fugl
        type: bird
      # Combined fish+herps in one discipline: stock Specify has no joint type.
      # Use fish defaults; split to herpetology later if needed.
      - name: Fisk og herptiler
        type: fish

  - name: Geology/paleontology
    disciplines:
      - name: Geologi
        type: geology
      - name: Paleontologi
        type: invertpaleo
        collections:
          - { code: PMO, name: NHM-Paleo }
